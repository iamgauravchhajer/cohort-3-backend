<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="card">
      <!-- Google Logo -->
      <div class="logo-wrap">
        <svg viewBox="0 0 24 24" width="40" height="40">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
        </svg>
      </div>

      <!-- Notification message if error/success occurs -->
      <div id="status-msg" class="status-msg hidden"></div>

      <!-- State 1: Guest (Sign In) -->
      <div id="guest-view">
        <h1 class="title">Sign in</h1>
        <p class="subtitle">to continue with Google OAuth</p>

        <a href="/auth/google" class="google-btn" id="google-login-btn">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
          </svg>
          <span>Continue with Google</span>
        </a>
      </div>

      <!-- State 2: User Profile (Logged In) -->
      <div id="user-view" class="hidden">
        <div class="user-avatar-wrap">
          <img id="user-avatar" class="user-avatar" src="" alt="Profile Photo">
        </div>
        <h2 id="user-name" class="user-name">User Name</h2>
        <p id="user-email" class="user-email">user@gmail.com</p>

        <div class="user-info">
          <div class="info-row">
            <span class="info-label">Google ID:</span>
            <span id="user-google-id" class="info-val">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="info-val status-badge">Logged In</span>
          </div>
        </div>

        <button id="logout-btn" class="logout-btn" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
